name: qc

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate and QC
        run: python -m generator.main
